<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Location Data</title>
    <script src="sheets-config.js"></script>
    <script src="sheets-data-connector.js"></script>
    <style>
        body {
            font-family: monospace;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background: #f0f0f0;
        }
        .section {
            background: white;
            margin: 20px 0;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        pre {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            overflow: auto;
            max-height: 400px;
            border: 1px solid #ddd;
            white-space: pre-wrap;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        .location-row {
            padding: 5px;
            margin: 2px 0;
            border-radius: 3px;
        }
        .diaspora { background: #e3f2fd; }
        .senegal { background: #e8f5e8; }
        .unknown { background: #fff3e0; }
    </style>
</head>
<body>
    <h1>🌍 Debug Location Categorization</h1>

    <div class="section">
        <h2>🔍 Analyze Location Data</h2>
        <button onclick="analyzeLocations()">Analyze All Locations</button>
        <div id="analysis-status"></div>
    </div>

    <div class="section">
        <h2>📊 Location Breakdown</h2>
        <div id="location-summary"></div>
    </div>

    <div class="section">
        <h2>📋 All Location Values</h2>
        <div id="location-details"></div>
    </div>

    <script>
        async function analyzeLocations() {
            const statusEl = document.getElementById('analysis-status');
            const summaryEl = document.getElementById('location-summary');
            const detailsEl = document.getElementById('location-details');

            statusEl.innerHTML = '<div style="color: blue;">Fetching data...</div>';

            try {
                // Fetch raw data
                const rawData = await fetchSheetData();

                if (!rawData || rawData.length === 0) {
                    statusEl.innerHTML = '<div style="color: red;">No data received</div>';
                    return;
                }

                statusEl.innerHTML = `<div style="color: green;">✅ Fetched ${rawData.length} rows</div>`;

                // Find location column
                const locationColumns = ['Quartier/Zone', 'Location', 'Localisation', 'Zone', 'Quartier', 'Lieu'];
                let locationKey = null;

                // Check which location column exists
                const sampleRow = rawData[0];
                for (const col of locationColumns) {
                    if (sampleRow.hasOwnProperty(col)) {
                        locationKey = col;
                        break;
                    }
                }

                if (!locationKey) {
                    // Check all keys to find location-related column
                    const allKeys = Object.keys(sampleRow);
                    locationKey = allKeys.find(key =>
                        key.toLowerCase().includes('location') ||
                        key.toLowerCase().includes('zone') ||
                        key.toLowerCase().includes('quartier') ||
                        key.toLowerCase().includes('lieu')
                    );
                }

                if (!locationKey) {
                    detailsEl.innerHTML = '<div style="color: red;">No location column found. Available columns:</div><pre>' +
                        JSON.stringify(Object.keys(sampleRow), null, 2) + '</pre>';
                    return;
                }

                // Analyze locations
                const locations = rawData.map(row => row[locationKey] || '').filter(loc => loc.trim() !== '');
                const uniqueLocations = [...new Set(locations)];

                // Current categorization logic
                const diasporaKeywords = ['france', 'usa', 'états-unis', 'canada', 'europe', 'étranger'];

                let diasporaCount = 0;
                let senegalCount = 0;
                let unknownCount = 0;

                const locationAnalysis = uniqueLocations.map(location => {
                    const count = locations.filter(loc => loc === location).length;
                    const lowerLoc = location.toLowerCase();

                    let category = 'unknown';
                    if (diasporaKeywords.some(keyword => lowerLoc.includes(keyword))) {
                        category = 'diaspora';
                        diasporaCount += count;
                    } else if (lowerLoc.includes('sénégal') || lowerLoc.includes('senegal') ||
                               lowerLoc.includes('dakar') || lowerLoc.includes('thies') ||
                               lowerLoc.includes('rufisque') || lowerLoc.includes('pikine') ||
                               lowerLoc.includes('guediawaye') || lowerLoc.includes('kaolack') ||
                               lowerLoc.includes('saint-louis') || lowerLoc.includes('ziguinchor') ||
                               category === 'unknown') {
                        category = 'senegal';
                        senegalCount += count;
                    } else {
                        unknownCount += count;
                    }

                    return {
                        location,
                        count,
                        category
                    };
                });

                // Display summary
                summaryEl.innerHTML = `
                    <div style="font-size: 18px; margin-bottom: 20px;">
                        <strong>Column used:</strong> "${locationKey}"<br>
                        <strong>Total responses:</strong> ${locations.length}<br>
                        <strong>Unique locations:</strong> ${uniqueLocations.length}
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px;">
                        <div style="padding: 15px; background: #e3f2fd; border-radius: 8px;">
                            <strong>Diaspora:</strong> ${diasporaCount}
                        </div>
                        <div style="padding: 15px; background: #e8f5e8; border-radius: 8px;">
                            <strong>Sénégal:</strong> ${senegalCount}
                        </div>
                        <div style="padding: 15px; background: #fff3e0; border-radius: 8px;">
                            <strong>Unknown:</strong> ${unknownCount}
                        </div>
                    </div>
                `;

                // Display details
                let detailsHTML = '<h3>Location Breakdown:</h3>';
                locationAnalysis
                    .sort((a, b) => b.count - a.count)
                    .forEach(item => {
                        detailsHTML += `
                            <div class="location-row ${item.category}">
                                <strong>${item.location}</strong> (${item.count} responses) → ${item.category}
                            </div>
                        `;
                    });

                detailsEl.innerHTML = detailsHTML;

            } catch (error) {
                statusEl.innerHTML = `<div style="color: red;">Error: ${error.message}</div>`;
                detailsEl.innerHTML = `<pre>${error.stack}</pre>`;
            }
        }

        // Auto-run analysis
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(analyzeLocations, 1000);
        });
    </script>
</body>
</html>
